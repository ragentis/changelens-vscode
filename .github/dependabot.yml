version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: "ci(deps)"

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      development:
        dependency-type: development
        update-types: [minor, patch]
    # Keep compatibility types aligned with supported runtimes.
    ignore:
      # Update with `engines.vscode`; `vsce` requires matching major/minor compatibility.
      - dependency-name: "@types/vscode"
      # The bundle targets Node 20 even though CI executes on Node 24.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: "chore(deps)"
