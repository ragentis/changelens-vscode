name: Release

# Main pushes update the release PR; merging it enables verification and publishing phases.
on:
  push:
    branches: [main]
  # Recompute the release PR after a configuration change.
  workflow_dispatch:

# Nothing here needs write access by default; the two phases that do ask for it themselves.
permissions:
  contents: read

# Marketplace versions are immutable, so no two releases may publish concurrently.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # Update the release PR, or tag and draft the release when that PR is merged.
  prepare:
    name: Prepare the release
    # The reusable workflow path and pre-environment publication both resolve from this ref.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      released: ${{ steps.release.outputs.release_created }}
      tag: ${{ steps.release.outputs.tag_name }}
      sha: ${{ steps.release.outputs.sha }}
    steps:
      - id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          target-branch: main

  # Verify the reported release commit and build the VSIX used by every later phase.
  verify:
    name: Verify the release
    needs: prepare
    if: needs.prepare.outputs.released == 'true'
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ needs.prepare.outputs.sha }}

  # Publish the verified VSIX to its existing draft; GitHub remains the canonical reversible source.
  publish-release:
    name: Publish the release
    needs: [prepare, verify]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: vsix
          path: release-artifact

      - name: Check the package against the tag
        env:
          TARGET_TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          expected="changelens-${TARGET_TAG#v}.vsix"
          mapfile -t packages < <(find release-artifact -maxdepth 1 -type f -name '*.vsix')

          if [ "${#packages[@]}" -ne 1 ] || [ "$(basename "${packages[0]}")" != "$expected" ]; then
            echo "Expected exactly ${expected}, found: $(find release-artifact -maxdepth 1 -type f -printf '%f ')" >&2
            exit 1
          fi

          echo "VSIX=${packages[0]}" >> "$GITHUB_ENV"

      - name: Attach the package and publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TARGET_TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          gh release upload "$TARGET_TAG" "$VSIX" --clobber
          gh release edit "$TARGET_TAG" --draft=false --latest

  # Publish the same verified bytes to both registries. Entries rerun independently and skip versions
  # already present; no GitHub credential reaches the registry environment.
  registries:
    name: Publish to ${{ matrix.registry }}
    needs: [prepare, publish-release]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: release
    strategy:
      fail-fast: false
      matrix:
        include:
          - registry: Visual Studio Marketplace
            cli: vsce
          - registry: Open VSX
            cli: ovsx
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.sha }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: vsix
          path: release-artifact
      - name: Publish
        env:
          TARGET_TAG: ${{ needs.prepare.outputs.tag }}
          # Each entry is handed the token for its own registry and nothing else.
          VSCE_PAT: ${{ matrix.cli == 'vsce' && secrets.VSCE_PAT || '' }}
          OVSX_PAT: ${{ matrix.cli == 'ovsx' && secrets.OVSX_PAT || '' }}
        run: |
          npx --no-install ${{ matrix.cli }} publish \
            --packagePath "release-artifact/changelens-${TARGET_TAG#v}.vsix" --skip-duplicate
